<style>
:root {
--bg-page:#000;
--bg-frame:#2b2b2e;
--menu-bg:#1f1f23;
--text-main:#efeff1;
--text-muted:#adadb8;
--kick-green:#53fc18;
}

* { margin:0; padding:0; box-sizing:border-box; }

body {
font-family:Arial, sans-serif;
background:var(--bg-page) url('hintergrund.jpg') center/cover fixed;
color:var(--text-main);
}

/* WRAPPER */
#main-wrapper {
width:915px;
margin:30px auto;
background:var(--bg-frame);
padding:15px;
display:flex;
gap:15px;
position:relative; /* 🔥 wichtig für absolute Position */
}

/* LINKS */
.column-left {
width:230px;
margin-left:-15px;
}

#team-logo {
width:230px;
height:230px;
background-size:cover;
background-position:center;
}

/* RECHTS */
.column-right {
flex:1;
display:flex;
flex-direction:column;
gap:10px;
}

#team-banner {
height:115px;
background-size:cover;
background-position:center;
}

.player-wrapper {
aspect-ratio:16/9;
background:#000;
}

iframe {
width:100%;
height:100%;
border:none;
}

/* 🔥 COPYRIGHT UNTEN RECHTS */
#copyright {
position:absolute;
bottom:5px;
right:10px;
font-size:11px;
color:var(--text-muted);
opacity:0.7;
}
</style>
</head>

<body>

<div id="main-wrapper">

<div class="column-left">
<div id="team-logo"></div>
</div>

<div class="column-right">
<div id="team-banner"></div>

<div class="player-wrapper">
<iframe id="main-player"></iframe>
</div>

<div style="color:#53fc18;text-align:center;cursor:pointer;">
About TeamMember
</div>

<div style="background:#1f1f23;padding:10px;">
<h2 id="team-name-display"></h2>
<p id="team-desc-container"></p>
</div>
</div>

<!-- 🔥 HIER IST ES JETZT -->
<div id="copyright">
© <span id="year"></span> Neo Matrix
</div>

</div>

<script>
document.getElementById("year").textContent = new Date().getFullYear();

function init(){
document.getElementById('team-logo').style.backgroundImage=`url('${TEAM_LOGO_URL}')`;
document.getElementById('team-banner').style.backgroundImage=`url('${TEAM_BANNER_URL}')`;

document.getElementById('team-name-display').textContent=TEAM_NAME;
document.getElementById('team-desc-container').textContent=TEAM_BESCHREIBUNG;
}

window.onload=init;
</script>

</body>
</html>
