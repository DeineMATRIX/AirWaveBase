<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="no-referrer">
    <title>AirWaveBase</title>
  
    <script src="team-data.js"></script>
    
    <style>
        :root {
            --kick-green: #53fc18;
            --kick-green-hover: #45d614;
            --bg-page: #000000;
            --bg-frame: #2b2b2e;
            --menu-bg: #1f1f23;
            --text-main: #efeff1;
            --text-muted: #adadb8;
            --hover-bg: #3a3a3f;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; border: none !important; outline: none !important; }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-page) url('hintergrund.jpg') center/cover fixed;
            color: var(--text-main);
            user-select: none;
        }

        #main-wrapper {
            width: 955px;
            margin: 30px auto;
            background-color: var(--bg-frame);
            padding: 15px;
            padding-bottom: 28px;
            border-radius: 2px;
            display: flex;
            gap: 15px;
            box-shadow: 0 0 30px rgba(0,0,0,0.9);
            position: relative;
        }

        .column-left {
            width: 270px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-left: -15px;
        }

        #team-logo { width: 230px; height: 230px; background-size: cover; background-position: center; border-radius: 2px; background-color: #000; }

        .section-title { font-size: 14px; font-weight: 700; margin-bottom: 10px; padding: 0 5px; display: flex; justify-content: space-between; }

        #team-list-wrapper { position: relative; background: var(--menu-bg); border-radius: 2px; overflow: hidden; }
        #team-list { display: flex; flex-direction: column; max-height: 336px; overflow-y: auto; padding-bottom: 45px; }

        .member-btn {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 6px 12px;
            background: transparent;
            color: var(--text-main);
            cursor: pointer;
            width: 100%;
            font-size: 15px;
            transition: 0.1s;
            height: 42px;
        }

        .member-left { display: flex; align-items: center; flex: 1; }

        .avatar {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            margin-right: 10px;
            object-fit: cover;
            background: #222;
        }

        .viewer-count {
            color: #888;
            font-size: 14px;
            min-width: 75px;
            text-align: right;
        }
        .viewer-count.live { color: var(--kick-green); font-weight: 600; }

        .member-btn:hover { background-color: var(--hover-bg); }
        .member-btn.active { background-color: var(--kick-green) !important; color: #000 !important; font-weight: 700; }

        #scroll-top-btn {
            position: absolute; bottom: 0; left: 0; right: 0;
            display: none; padding: 8px; background: #1a1a1e;
            color: var(--text-main); font-size: 11px; text-align: center;
            cursor: pointer; border-top: 1px solid #333;
        }

        .column-right { width: 640px; display: flex; flex-direction: column; gap: 12px; }
        #team-banner { width: 640px; height: 115px; background-size: cover; background-position: center; border-radius: 2px; background-color: #000; }

        .player-wrapper { width: 100%; aspect-ratio: 16 / 9; background: #000; border-radius: 2px; overflow: hidden; }
        iframe { width: 100%; height: 100%; border: none; }

        .about-btn {
            background: var(--menu-bg);
            color: var(--kick-green);
            padding: 11px 15px;
            border-radius: 2px;
            text-align: center;
            font-weight: 600;
            cursor: pointer;
        }
        .about-btn:hover { background: #2a2a2f; color: var(--kick-green-hover); }

        .info-panel { background: var(--menu-bg); padding: 15px; border-radius: 2px; }
        .info-panel a { color: var(--kick-green); }

        #copyright {
            position: absolute;
            bottom: 8px;
            right: 12px;
            font-size: 11px;
            color: var(--text-muted);
            opacity: 0.8;
        }

        @media (max-width: 950px) {
            #main-wrapper { flex-direction: column; width: 95%; margin: 15px auto; padding: 15px; }
            .mobile-top { display: flex; gap: 10px; margin-bottom: 12px; }
            #mobile-logo { width: 75px; height: 75px; background-size: cover; border-radius: 2px; }
            #mobile-banner { flex: 1; height: 75px; background-size: cover; border-radius: 2px; }
            .column-left > #team-logo, .column-right > #team-banner { display: none; }
            .column-left { margin-left: 0; width: 100%; }
        }
    </style>
</head>
<body oncontextmenu="return false;">

<div id="main-wrapper">
    <div class="mobile-top">
        <div id="mobile-logo"></div>
        <div id="mobile-banner"></div>
    </div>

    <div class="column-left">
        <div id="team-logo"></div>
        <aside>
            <div class="section-title">
                <span>Team Members</span>
                <span id="member-count">0</span>
            </div>
            <div id="team-list-wrapper">
                <div id="team-list"></div>
                <button id="scroll-top-btn" onclick="scrollToTop()">Back to top</button>
            </div>
        </aside>
    </div>

    <div class="column-right">
        <div id="team-banner"></div>
        <div class="player-wrapper">
            <iframe id="main-player"></iframe>
        </div>
       
        <div id="about-btn" class="about-btn" onclick="openAboutPage()">
            About <span id="current-member-name">TeamMember</span>
        </div>
        <div class="info-panel">
            <h2 id="team-name-display"></h2>
            <p id="team-desc-container"></p>
        </div>
    </div>

    <div id="copyright">© <span id="year"></span> DeineMATRIX</div>
</div>

<script>
    const WORKER_URL = "https://airwavebase-kick-api.neonator-4d6.workers.dev";
    let currentMember = "";

    const listContainer = document.getElementById('team-list');
    const player = document.getElementById('main-player');
    const currentNameSpan = document.getElementById('current-member-name');

    document.getElementById("year").textContent = new Date().getFullYear();

    async function buildTeamList() {
        listContainer.innerHTML = '';

        const promises = TEAM_DATA.MITGLIEDER.map(async (name) => {
            try {
                const res = await fetch(`${WORKER_URL}?username=${encodeURIComponent(name)}`);
                const data = await res.json();

                const channel = data.data || {};
                const user = channel.user || {};
                const stream = channel.livestream;

                return {
                    name: name,
                    avatar: user.profile_pic || user.avatar || null,
                    viewers: stream?.viewer_count || 0,
                    isLive: !!stream
                };
            } catch (e) {
                return { name: name, avatar: null, viewers: 0, isLive: false };
            }
        });

        const members = await Promise.all(promises);

        // Sortierung: Live-Streams zuerst, nach Zuschauern absteigend
        members.sort((a, b) => {
            if (a.isLive && b.isLive) return b.viewers - a.viewers;
            if (a.isLive) return -1;
            if (b.isLive) return 1;
            return 0;
        });

        members.forEach(item => {
            const btn = document.createElement('button');
            btn.className = 'member-btn';

            const avatarHTML = item.avatar 
                ? `<img class="avatar" src="${item.avatar}" onerror="this.style.display='none'; this.parentElement.insertAdjacentHTML('afterbegin', '<div class=\\'avatar\\' style=\\'background:#333;color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;\\'>${item.name[0]}</div>')">`
                : `<div class="avatar" style="background:#333;color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;">${item.name[0]}</div>`;

            btn.innerHTML = `
                <div class="member-left">
                    ${avatarHTML}
                    <span>${item.name}</span>
                </div>
                ${item.viewers >= 1 ? `<span class="viewer-count ${item.isLive ? 'live' : ''}">${item.viewers.toLocaleString('de-DE')}</span>` : ''}
            `;

            btn.onclick = () => loadStream(item.name, btn);
            listContainer.appendChild(btn);

            if (!currentMember) loadStream(item.name, btn);
        });

        document.getElementById('member-count').textContent = TEAM_DATA.MITGLIEDER.length;
    }

    function loadStream(name, element) {
        currentMember = name.trim();
        currentNameSpan.textContent = currentMember;
        player.src = `https://player.kick.cx/${currentMember}?fullscreen=false&quality=false&muted=false&reload=false&pip=false`;
        
        document.querySelectorAll('.member-btn').forEach(el => el.classList.remove('active'));
        element.classList.add('active');
    }

    function openAboutPage() {
        if (currentMember) {
            const currentSrc = player.src;
            player.src = "";
            setTimeout(() => player.src = currentSrc, 100);
            window.open(`https://kick.com/${currentMember}/about`, '_blank', 'noopener,noreferrer');
        }
    }

    function init() {
        const logoUrl = TEAM_DATA.TEAM_LOGO_URL || "logo.png";
        const bannerUrl = TEAM_DATA.TEAM_BANNER_URL || "banner.jpg";

        document.getElementById('team-logo').style.backgroundImage = `url('${logoUrl}')`;
        document.getElementById('team-banner').style.backgroundImage = `url('${bannerUrl}')`;
        document.getElementById('mobile-logo').style.backgroundImage = `url('${logoUrl}')`;
        document.getElementById('mobile-banner').style.backgroundImage = `url('${bannerUrl}')`;

        document.getElementById('team-name-display').textContent = TEAM_DATA.TEAM_NAME;
        document.getElementById('team-desc-container').innerHTML = TEAM_DATA.TEAM_BESCHREIBUNG;

        buildTeamList();

        listContainer.onscroll = () => {
            document.getElementById('scroll-top-btn').style.display = listContainer.scrollTop > 80 ? "block" : "none";
        };
    }

    function scrollToTop() {
        listContainer.scrollTo({ top: 0, behavior: 'smooth' });
    }

    window.onload = init;
</script>
</body>
</html>
